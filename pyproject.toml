# Karaoke Inteligente - IPC2, USAC (202307900)
# Configuración de Briefcase: genera el instalador .msi (Windows) y la app .apk (Android).
[tool.briefcase]
project_name = "karaoke"
bundle = "gt.edu.usac.ipc2"
version = "1.0.0"
url = "https://github.com/jeansitox5/IPC2_KaraokeInteligente_202602_202307900"
license = "MIT"
license-files = ["LICENSE"]
author = "Jonathan Jeanfranco Chirix Santizo"
author_email = "3122523740413@ingenieria.usac.edu.gt"

[tool.briefcase.app.karaoke]
formal_name = "Karaoke Inteligente"
description = "Karaoke que sigue al cantante y muestra la letra sincronizada"
long_description = """Muestra la letra línea por línea al ritmo del cantante.
Modo manual (búsqueda por 2-3 palabras) y modo automático con reconocimiento
de voz (Whisper en Windows, reconocedor de Android en el teléfono).
"""
icon = "src/karaoke/resources/icons/karaoke"
sources = [
    "src/karaoke",
]
test_sources = [
    "tests",
]
requires = []
test_requires = [
    "pytest",
]
# Android: se traduce a android.permission.RECORD_AUDIO
permission.microphone = "Para escuchar al cantante y mostrar la letra a su ritmo."

[tool.briefcase.app.karaoke.windows]
requires = [
    "toga-winforms~=0.5.0",
    "numpy",
    "sounddevice",
]

[tool.briefcase.app.karaoke.android]
requires = [
    "toga-android~=0.5.0",
]
# Whisper solo se usa en Windows: no se incluye en el .apk
cleanup_paths = [
    "**/karaoke/resources/whisper",
]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
]
